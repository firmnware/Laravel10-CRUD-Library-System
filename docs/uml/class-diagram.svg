14" textLength="596.586">Batas pinjaman aktif 3 buku dan durasi maksimal 30 hari (config/perpustakaan.php).</text><text x="25.354" y="1637.23" fill="#000" font-size="14" textLength="585.922">Kardinalitas: User-Loan lewat member_id 1 ke 0..*, lewat processed_by 0..1 ke 0..*;</text><text x="25.354" y="1653.527" fill="#000" font-size="14" textLength="446.421">Book-Loan 1 ke 0..*. Relasi lain mengikuti notasi pada diagram.</text></g><?plantuml-src lLZRRXit47tNLn3gG-n45pk1NspNW2yDsYH23Jj1MpI5GEsELynooGt9jQi6-VSUSYzQhTQN8cY48B8vXyEvd1aExOIJnCubjvPT29uOdh4nknRMKSOkoUI5TJpbN0sUiUiYMv0vP3pFfpCTaxJJvvDycRCNBEQEBxYbQIQWmWcj89j7XhYZUGsAjBeHoJHlQVMIWKs5oha_EV9sd3fdnA9mz0isN8j_YEqDbY8c5WaJIMh1xPB7-aweXDrmQTiIAHIvLKvC6xVKWq7EevGdn8QdUVxnOsdya7qP35Xv9ljWoR3ZuzF2BKav4Nb_99sS0CFmUS54p0xPGYH2EU0ktvwSL0B5CuB8mcYLL6kKSI6RHU0B9JuNrEm9ylaj6N4ZA9vp1wmJ6I4gMGwuAgGipwysvB3nJfkuUv3HqXzEgiXsU9m9DM8P-IpjLW1eT8Lj894JjpHYGfK_rQXygTNQYPtzWzq-8tWS6x9UcQE_NH-YF7iU8RvhRGTxkqq4HcnhpoSjr1pyyJl2LuzUfCZDfKRmdn0hGvKPJgUasbdOWfO4xIQW4XPvV9zmF0vVFx25re3ix09ngq6HBpxU8lfQayQU-gG4EQ2oMPu52xlhKdDbm-BFtCwuMjNf8SMb4zGdIyYTXboUQMFqdJtNXN811wRMRd9LIhi7BhdzW8eHyUN62HNYwxeypX69H9jLKmvHkO0TywTLnix-tbvDjvXiP4JksyG3PFh6vBpmRgJTaBLyEeEuyITWxtUbSdVLGRn-sqDe5rfgu_VBWuFQRuxkeiscgBVQYuKKTabFWAw8cpBNVL9X5wgberM8Qy_qRUkSFYNMwIZTu1E_HVlocFcsx3lbjav8IEyPIQqI-ru_KaUebNFlxWSZcqicm3PwAeeYeBQhzhJskokAoJjawTg7O-TpmN65k1NxaUtNdQ7MePu0R77q7JnfE1hSkf-ZNln0w-qswIwJ6xalXOUalf6q6tOTWu9wLZVldt8pnICqQLSOHN5p0naTuMv1rXUhHoliczbJs2gzNUPutti5PGjUrQJwLL4hwbV1cMrPuzHPFqyJKeHfYSwHj1OFkxS8Q0krhp7IRBAsHK3FxC8OZ2xRi1kOwDQuTpZmWg_i9cXTm81S-Vb4mP97SDSXkUTQQlD0FJN0zsW63-D-uyOVEqFGCAtTW-sKHndyfaXAOZrM9jjjl5CafPeUGdzVedfZUwd3cxcYBMc5fhpHrnTsCqFynyWykMt4uCfSbl5Qi-G6T9ppp0ybFeuKYOnBp0AZb_qJQX76aH7p_pUz0Jy_DY7-Vv7kxHK8DFuzm_Rnc5qH8YwO9LjmmNwI6aI2kt1U6nA9OYcjMFCm2dkmTLOW7RaKaRy0OcmNqB7YA7-4EQOKBn25WAa4N_vrCWtpIYoMk89Kac9rWP-W284WgLRSxyEhnU1XfOwOWb0mIHwQUsaiN86fmXyb2PqddWp2esUuFuH9vKrpkCxoXd2uDvay7pQSseP1lg6cNILTIAMiLRiTV3DiRkq98JXiJsE3iBIfjMoD_WuRX5zRJkotdQZu